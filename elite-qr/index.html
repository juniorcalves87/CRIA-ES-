<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="description" content="ELITE QR — gestão de ativos e manutenção industrial">
<title>ELITE QR — Gestão de Manutenção</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:Inter,system-ui,sans-serif}.glass{backdrop-filter:blur(12px)}.safe{padding-bottom:88px}@media(min-width:768px){.safe{padding-bottom:24px}}</style>
</head>
<body class="bg-slate-950 text-slate-100"><div id="app"></div>
<script>
const KEY='eliteqr_mvp_v2';
const demo={assets:[
{id:'1',tag:'EQP-001',name:'Compressor de Ar GA37',manufacturer:'Atlas Copco',model:'GA37',serial:'AC-4471',location:'Casa de Máquinas',team:'Utilidades',criticality:'Alta',status:'Operacional',qr:'EQP-001'},
{id:'2',tag:'EQP-002',name:'Bomba Centrífuga P-102',manufacturer:'KSB',model:'Megachem 50',serial:'KSB-88213',location:'Linha 1',team:'Mecânica',criticality:'Alta',status:'Atenção',qr:'EQP-002'},
{id:'3',tag:'EQP-003',name:'Prensa Hidráulica 200T',manufacturer:'Schuler',model:'PH-200',serial:'SCH-20031',location:'Linha 1',team:'Mecânica',criticality:'Alta',status:'Parado',qr:'EQP-003'},
{id:'4',tag:'EQP-004',name:'Motor Elétrico 75cv',manufacturer:'WEG',model:'W22',serial:'WEG-778120',location:'Linha 2',team:'Elétrica',criticality:'Média',status:'Operacional',qr:'EQP-004'},
{id:'5',tag:'EQP-005',name:'Painel CCM-01',manufacturer:'Siemens',model:'SIVACON',serial:'SIE-CCM01',location:'Casa de Máquinas',team:'Elétrica',criticality:'Alta',status:'Atenção',qr:'EQP-005'},
{id:'6',tag:'EQP-006',name:'Caldeira de Vapor',manufacturer:'Aalborg',model:'OL-4',serial:'AAL-9902',location:'Utilidades',team:'Utilidades',criticality:'Alta',status:'Operacional',qr:'EQP-006'}
],reports:[
{id:'r1',asset:'EQP-002',title:'Vibração elevada no mancal',description:'Vibração percebida durante ronda.',priority:'Alta',status:'Aberto',date:'02/10/2026'},
{id:'r2',asset:'EQP-003',title:'Vazamento hidráulico',description:'Vazamento no cilindro principal.',priority:'Crítica',status:'Aberto',date:'02/10/2026'},
{id:'r3',asset:'EQP-005',title:'Aquecimento em disjuntor',description:'Ponto quente identificado.',priority:'Média',status:'Em andamento',date:'01/10/2026'}],
orders:[
{id:'OS-000001',asset:'EQP-003',type:'Corretiva',priority:'Crítica',status:'Em execução',team:'Mecânica',date:'02/10/2026',desc:'Substituir vedação do cilindro hidráulico.'},
{id:'OS-000002',asset:'EQP-002',type:'Corretiva',priority:'Alta',status:'Planejada',team:'Mecânica',date:'01/10/2026',desc:'Verificar alinhamento e rolamento.'},
{id:'OS-000003',asset:'EQP-001',type:'Preventiva',priority:'Média',status:'Planejada',team:'Utilidades',date:'25/09/2026',desc:'Troca de óleo e filtros.'}],
inspections:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{assets:[],reports:[],orders:[],inspections:[],demo:false};
let page='dashboard',selected=null,scanner=null; function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>new Date().toLocaleDateString('pt-BR');
function save(){localStorage.setItem(KEY,JSON.stringify(db));if(window.ELITECloud?.queueSync)window.ELITECloud.queueSync()}
function seed(){db=JSON.parse(JSON.stringify({...demo,demo:true}));save();render();toast('Dados demonstrativos carregados.')}
function clearDemo(){if(confirm('Limpar os dados atuais e voltar ao estado vazio?')){db={assets:[],reports:[],orders:[],inspections:[],demo:false};save();render()}}
function toast(t){const e=document.createElement('div');e.className='fixed bottom-24 md:bottom-6 right-5 z-[100] bg-violet-600 text-white px-4 py-3 rounded-xl shadow-xl';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function badge(v){const c=['Operacional','Concluída','OK'].includes(v)?'bg-emerald-500/15 text-emerald-300':(['Atenção','Planejada','Em execução','Alta','Média'].includes(v)?'bg-amber-500/15 text-amber-300':(['Parado','Crítica','Aberto'].includes(v)?'bg-rose-500/15 text-rose-300':'bg-slate-700 text-slate-200'));return '<span class="px-2 py-1 rounded-full text-xs font-semibold '+c+'">'+esc(v)+'</span>'}
function nav(p){if(scanner){scanner.stop().catch(()=>{});scanner=null}page=p;selected=null;render()}
function shell(content,title){return '<div class="min-h-screen bg-[#090d18]"><aside class="hidden md:flex fixed inset-y-0 left-0 w-64 bg-[#111827] border-r border-slate-800 p-5 flex-col"><div class="text-2xl font-black text-violet-300">ELITE <span class="text-white">QR</span></div><div class="text-xs text-slate-500 mt-1">Manutenção inteligente</div><nav class="mt-8 space-y-1">' + [['dashboard','⌂','Dashboard'],['assets','⚙','Equipamentos'],['scan','⌁','Scanner QR'],['reports','⚠','Relatos'],['orders','☷','Ordens de serviço'],['inspections','✓','Inspeções'],['manager','▣','Gestor']].map(x=>'<button onclick="nav(\\\''+x[0]+'\\\')" class="w-full text-left px-3 py-3 rounded-xl '+(page===x[0]?'bg-violet-600/20 text-violet-200':'text-slate-300 hover:bg-slate-800')+'">'+x[1]+' &nbsp; '+x[2]+'</button>').join('')+'</nav><div class="mt-auto text-xs text-slate-500">MVP local + nuvem • controle do projeto no GitHub</div></aside><main class="md:ml-64 safe"><header class="sticky top-0 z-20 glass bg-[#090d18]/90 border-b border-slate-800 px-4 md:px-8 py-4 flex items-center justify-between"><div><div class="text-xs text-slate-500">ELITE QR / MVP</div><h1 class="text-xl font-bold">'+title+'</h1></div><div class="flex gap-2"><button onclick="seed()" class="text-xs border border-violet-500/40 text-violet-200 px-3 py-2 rounded-lg">Demo</button><button onclick="clearDemo()" class="text-xs border border-slate-700 text-slate-400 px-3 py-2 rounded-lg">Limpar</button></div></header><section class="p-4 md:p-8 max-w-7xl mx-auto">'+content+'</section></main><nav class="md:hidden fixed bottom-0 inset-x-0 bg-[#111827] border-t border-slate-800 grid grid-cols-7 z-50"><button onclick="nav(this.dataset.nav)" data-nav="dashboard" class="py-2 text-[10px]">⌂<br>Início</button><button onclick="nav(this.dataset.nav)" data-nav="assets" class="py-2 text-[10px]">⚙<br>Ativos</button><button onclick="nav(this.dataset.nav)" data-nav="scan" class="py-2 text-[10px]">⌁<br>QR</button><button onclick="nav(this.dataset.nav)" data-nav="reports" class="py-2 text-[10px]">⚠<br>Relatos</button><button onclick="nav(this.dataset.nav)" data-nav="orders" class="py-2 text-[10px]">☷<br>OS</button><button onclick="nav(this.dataset.nav)" data-nav="inspections" class="py-2 text-[10px]">✓<br>Inspeções</button><button onclick="nav(this.dataset.nav)" data-nav="manager" class="py-2 text-[10px]">▣<br>Gestor</button></nav></div>'}
function dashboard(){const a=db.assets,r=db.reports,o=db.orders;const open=o.filter(x=>x.status!=='Concluída').length;return shell('<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">'+[['Equipamentos',a.length,'text-violet-300'],['Operacionais',a.filter(x=>x.status==='Operacional').length,'text-emerald-300'],['Parados',a.filter(x=>x.status==='Parado').length,'text-rose-300'],['OS abertas',open,'text-amber-300'],['Relatos',r.length,'text-rose-300']].map(x=>'<div class="bg-[#111827] border border-slate-800 rounded-2xl p-5"><div class="text-sm text-slate-400">'+x[0]+'</div><div class="text-3xl font-black mt-2 '+x[2]+'">'+x[1]+'</div></div>').join('')+'</div><div class="grid lg:grid-cols-2 gap-5 mt-6"><div class="bg-[#111827] border border-slate-800 rounded-2xl p-5"><h2 class="font-bold">Atenção necessária</h2><div class="mt-4 space-y-2">'+a.filter(x=>x.status!=='Operacional').map(x=>'<button onclick="openAsset(\''+x.id+'\')" class="w-full text-left flex justify-between gap-3 p-3 rounded-xl bg-slate-900 hover:bg-slate-800"><span><b>'+esc(x.tag)+'</b> · '+esc(x.name)+'</span>'+badge(x.status)+'</button>').join('')||'<div class="text-slate-500">Nenhum item pendente.</div>'+'</div></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-5"><h2 class="font-bold">Últimos relatos</h2><div class="mt-4 space-y-2">'+r.slice(0,5).map(x=>'<div class="p-3 rounded-xl bg-slate-900"><div class="flex justify-between gap-2"><b>'+esc(x.title)+'</b>'+badge(x.priority)+'</div><div class="text-xs text-slate-500 mt-1">'+esc(x.asset)+' · '+esc(x.date)+'</div></div>').join('')||'<div class="text-slate-500">Sem relatos.</div>'+'</div></div></div>', 'Painel operacional')}
function assetCard(x){return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-5"><div class="flex justify-between">'+badge(x.status)+'<span class="text-xs text-slate-500">'+esc(x.tag)+'</span></div><h3 class="font-bold text-lg mt-3">'+esc(x.name)+'</h3><p class="text-sm text-slate-400 mt-1">'+esc(x.manufacturer)+' · '+esc(x.model)+'</p><p class="text-xs text-slate-500 mt-2">'+esc(x.location)+' · '+esc(x.team)+'</p><div class="flex gap-2 mt-4"><button onclick="openAsset(\''+x.id+'\')" class="flex-1 bg-slate-800 rounded-lg py-2">Abrir</button><button onclick="showQR(\''+x.id+'\')" class="px-3 bg-violet-600/20 text-violet-200 rounded-lg">QR</button></div></div>'}
function assets(){return shell('<div class="flex flex-col sm:flex-row gap-3 justify-between mb-5"><input id="assetSearch" oninput="filterAssets()" placeholder="Buscar TAG, equipamento, local..." class="bg-[#111827] border border-slate-700 rounded-xl px-4 py-3 w-full sm:w-96"><button onclick="newAsset()" class="bg-violet-600 hover:bg-violet-500 rounded-xl px-4 py-3 font-bold">+ Novo equipamento</button></div><div id="assetList" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">'+db.assets.map(assetCard).join('')+'</div>','Equipamentos')}
function filterAssets(){const q=document.getElementById('assetSearch').value.toLowerCase();document.getElementById('assetList').innerHTML=db.assets.filter(x=>(x.name+x.tag+x.location+x.team+x.manufacturer).toLowerCase().includes(q)).map(assetCard).join('')||'<div class="text-slate-500">Nenhum equipamento.</div>'}
function openAsset(id){selected=db.assets.find(x=>x.id===id);page='asset';render()}
function assetDetail(){const x=selected;if(!x)return assets();const reps=db.reports.filter(r=>r.asset===x.tag),os=db.orders.filter(o=>o.asset===x.tag);return shell('<button onclick="nav(\'assets\')" class="text-slate-400 mb-5">← Equipamentos</button><div class="grid lg:grid-cols-3 gap-5"><div class="lg:col-span-2 bg-[#111827] border border-slate-800 rounded-2xl p-6"><div class="flex justify-between">'+badge(x.status)+'<span class="text-xs text-slate-500">'+esc(x.tag)+'</span></div><h2 class="text-2xl font-black mt-4">'+esc(x.name)+'</h2><p class="text-slate-400 mt-1">'+esc(x.manufacturer)+' · '+esc(x.model)+' · Série '+esc(x.serial||'—')+'</p><div class="grid grid-cols-2 gap-3 mt-6 text-sm"><div class="bg-slate-900 rounded-xl p-3"><span class="text-slate-500">Local</span><br>'+esc(x.location)+'</div><div class="bg-slate-900 rounded-xl p-3"><span class="text-slate-500">Equipe</span><br>'+esc(x.team)+'</div><div class="bg-slate-900 rounded-xl p-3"><span class="text-slate-500">Criticidade</span><br>'+badge(x.criticality)+'</div><div class="bg-slate-900 rounded-xl p-3"><span class="text-slate-500">QR</span><br>'+esc(x.qr)+'</div></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-6"><button onclick="newReport(\''+x.tag+'\')" class="bg-rose-600/20 text-rose-200 rounded-xl py-3">Relatar</button><button onclick="newOrder(\''+x.tag+'\')" class="bg-violet-600/20 text-violet-200 rounded-xl py-3">Abrir OS</button><button onclick="newInspection(\''+x.tag+'\')" class="bg-emerald-600/20 text-emerald-200 rounded-xl py-3">Inspecionar</button><button onclick="showQR(\''+x.id+'\')" class="bg-slate-800 rounded-xl py-3">QR</button><button onclick="editAsset(\''+x.id+'\')" class="bg-amber-600/20 text-amber-200 rounded-xl py-3">Editar</button><button onclick="deleteAsset(\''+x.id+'\')" class="bg-rose-600/20 text-rose-200 rounded-xl py-3">Excluir</button></div></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-6"><h3 class="font-bold">Histórico</h3><div class="mt-4 space-y-3 text-sm">'+[...reps.map(r=>'<div class="border-l-2 border-rose-500 pl-3"><b>Relato</b><br>'+esc(r.title)+'</div>'),...os.map(o=>'<div class="border-l-2 border-violet-500 pl-3"><b>'+esc(o.id)+'</b><br>'+esc(o.type)+' · '+esc(o.status)+'</div>')].join('')||'<span class="text-slate-500">Sem histórico.</span>'+'</div></div></div>','Detalhe do equipamento')}
function showQR(id){const x=db.assets.find(a=>a.id===id);if(!x)return;const url=location.origin+location.pathname+'?qr='+encodeURIComponent(x.qr);document.body.insertAdjacentHTML('beforeend','<div id="modal" class="fixed inset-0 bg-black/80 z-[80] flex items-center justify-center p-4"><div class="bg-white text-slate-900 rounded-2xl p-6 text-center max-w-sm w-full"><h2 class="font-black text-xl">'+esc(x.tag)+'</h2><p class="mb-3">'+esc(x.name)+'</p><div id="qrBox" class="min-h-[220px] flex items-center justify-center bg-white rounded-xl"></div><p class="text-xs mt-2 break-all">'+esc(url)+'</p><div class="flex gap-2 mt-4"><button onclick="window.print()" class="flex-1 bg-slate-900 text-white rounded-lg py-2">Imprimir</button><button onclick="this.closest('#modal').remove()" class="flex-1 bg-slate-200 rounded-lg py-2">Fechar</button></div></div></div>');const box=document.getElementById('qrBox');if(typeof QRCode!=='undefined'&&QRCode.toCanvas){const canvas=document.createElement('canvas');canvas.width=220;canvas.height=220;canvas.setAttribute('aria-label','QR Code '+x.tag);box.appendChild(canvas);QRCode.toCanvas(canvas,url,{width:220,margin:2},err=>{if(err){canvas.remove();qrFallback(box,url,x.tag)}})}else{qrFallback(box,url,x.tag)}}
function qrFallback(box,url,tag){const img=document.createElement('img');img.width=220;img.height=220;img.alt='QR Code '+tag;img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);img.onerror=()=>{box.innerHTML='<div class="text-sm text-rose-600">QR indisponível. URL abaixo pode ser copiada.</div>'};box.appendChild(img)}
function scan(){return shell('<div class="max-w-xl mx-auto"><div class="bg-[#111827] border border-slate-800 rounded-2xl p-6"><h2 class="text-xl font-bold">Scanner QR</h2><p class="text-slate-400 text-sm mt-1">Use a câmera ou informe a TAG/token.</p><div id="reader" class="mt-5 rounded-xl overflow-hidden"></div><div class="mt-5 flex gap-2"><input id="manualQr" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3" placeholder="EQP-001"><button onclick="manualOpen()" class="bg-violet-600 rounded-xl px-4">Abrir</button></div></div></div>','Scanner QR')}
function startScanner(){setTimeout(()=>{try{scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:220},txt=>{const x=db.assets.find(a=>txt.includes(a.qr)||txt===a.qr);if(x){scanner.stop().catch(()=>{});scanner=null;openAsset(x.id)}},()=>{}).catch(()=>{})}catch(e){}},200)}
function manualOpen(){const q=document.getElementById('manualQr').value.trim();const x=db.assets.find(a=>a.qr===q||a.tag===q);if(x)openAsset(x.id);else toast('Equipamento não encontrado.')}
function reports(){return shell('<div class="flex justify-between mb-5"><h2 class="text-xl font-bold">Relatos</h2><button onclick="newReport()" class="bg-violet-600 rounded-xl px-4 py-2">+ Novo relato</button></div><div class="space-y-3">'+db.reports.map(r=>'<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4"><div class="flex flex-col sm:flex-row justify-between gap-3"><div><b>'+esc(r.title)+'</b><div class="text-xs text-slate-500 mt-1">'+esc(r.asset)+' · '+esc(r.date)+'</div><p class="text-sm text-slate-400 mt-2">'+esc(r.description||'')+'</p></div><div class="flex gap-2 items-center">'+badge(r.priority)+'<select onchange="setReportStatus(\''+r.id+'\',this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs"><option '+(r.status==='Aberto'?'selected':'')+'>Aberto</option><option '+(r.status==='Em andamento'?'selected':'')+'>Em andamento</option><option '+(r.status==='Concluído'?'selected':'')+'>Concluído</option></select></div></div><button onclick="newOrder(\''+esc(r.asset)+'\')" class="mt-3 text-sm text-violet-300">→ Transformar em OS</button></div>').join('')||'<div class="text-slate-500">Nenhum relato.</div>','Relatos')}
function orders(){return shell('<div class="flex justify-between mb-5"><h2 class="text-xl font-bold">Ordens de serviço</h2><button onclick="newOrder()" class="bg-violet-600 rounded-xl px-4 py-2">+ Nova OS</button></div><div class="space-y-3">'+db.orders.map(o=>'<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4"><div class="flex justify-between gap-3"><b>'+esc(o.id)+'</b><select onchange="setOrderStatus(\''+o.id+'\',this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs"><option '+(o.status==='Aberta'?'selected':'')+'>Aberta</option><option '+(o.status==='Planejada'?'selected':'')+'>Planejada</option><option '+(o.status==='Em execução'?'selected':'')+'>Em execução</option><option '+(o.status==='Concluída'?'selected':'')+'>Concluída</option><option '+(o.status==='Cancelada'?'selected':'')+'>Cancelada</option></select></div><div class="mt-2">'+esc(o.asset)+' · '+esc(o.type)+' · '+badge(o.priority)+'</div><div class="text-xs text-slate-500 mt-2">Equipe: '+esc(o.team)+' · '+esc(o.date)+'</div><p class="text-sm text-slate-400 mt-2">'+esc(o.desc||'')+'</p></div>').join('')||'<div class="text-slate-500">Nenhuma OS.</div>','Ordens de serviço')}
function inspections(){return shell('<div class="bg-[#111827] border border-slate-800 rounded-2xl p-6"><h2 class="text-xl font-bold">Inspeções</h2><p class="text-slate-400 mt-1">Selecione um equipamento.</p><div class="grid sm:grid-cols-2 gap-3 mt-5">'+db.assets.map(x=>'<button onclick="newInspection(\''+x.tag+'\')" class="text-left bg-slate-900 rounded-xl p-4 hover:bg-slate-800"><b>'+esc(x.tag)+'</b><br><span class="text-sm text-slate-400">'+esc(x.name)+'</span></button>').join('')+'</div></div>','Inspeções')}
function manager(){const a=db.assets,r=db.reports,o=db.orders,i=db.inspections;const checks=[['Armazenamento',true,'localStorage'],['Equipamentos',true,a.length+' registros'],['Relatos',true,r.length+' registros'],['Ordens',true,o.length+' registros'],['Inspeções',true,i.length+' registros'],['QR',typeof QRCode!=='undefined','biblioteca carregada'],['Scanner',typeof Html5Qrcode!=='undefined','biblioteca carregada']];return shell('<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">'+[['Ativos',a.length,'text-violet-300'],['Relatos',r.length,'text-rose-300'],['OS',o.length,'text-amber-300'],['Inspeções',i.length,'text-emerald-300']].map(x=>'<div class="bg-[#111827] border border-slate-800 rounded-2xl p-5"><div class="text-sm text-slate-400">'+x[0]+'</div><div class="text-3xl font-black mt-2 '+x[2]+'">'+x[1]+'</div></div>').join('')+'</div><div class="grid lg:grid-cols-2 gap-5 mt-6"><div class="bg-[#111827] border border-slate-800 rounded-2xl p-6"><h2 class="font-bold text-lg">Saúde do MVP</h2><div class="mt-4 space-y-3">'+checks.map(x=>'<div class="flex items-center justify-between bg-slate-900 rounded-xl p-3"><span>'+esc(x[0])+'</span><span class="text-xs '+(x[1]?'text-emerald-300':'text-rose-300')+'">'+(x[1]?'● OK':'● FALHA')+' · '+esc(x[2])+'</span></div>').join('')+'</div></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-6"><h2 class="font-bold text-lg">Gestão</h2><div class="grid sm:grid-cols-2 gap-3 mt-4"><button onclick="exportCSV()" class="bg-violet-600 rounded-xl py-3 font-bold">Exportar CSV</button><button onclick="exportJSON()" class="bg-slate-800 rounded-xl py-3">Backup JSON</button><button onclick="seed()" class="bg-slate-800 rounded-xl py-3">Recarregar Demo</button><button onclick="clearData()" class="bg-rose-600/20 text-rose-200 rounded-xl py-3">Limpar dados</button></div><div class="mt-5 text-xs text-slate-500">Painel administrativo do MVP. Autenticação e permissões reais entram na integração Supabase.</div></div></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 mt-5"><h2 class="font-bold">Distribuição por equipe</h2><div class="mt-4 space-y-3">'+[...new Set(a.map(x=>x.team))].map(t=>{const n=a.filter(x=>x.team===t).length;return '<div><div class="flex justify-between text-sm"><span>'+esc(t)+'</span><span>'+n+'</span></div><div class="h-2 bg-slate-800 rounded-full mt-1"><div class="h-2 bg-violet-500 rounded-full" style="width:'+Math.max(8,Math.round(n/Math.max(a.length,1)*100))+'%"></div></div></div>'}).join('')||'<span class="text-slate-500">Sem dados.</span>'+'</div></div>','Painel do gestor')}
function clearData(){if(confirm('Limpar todos os dados do MVP?')){db={assets:[],reports:[],orders:[],inspections:[],demo:false};save();render()}}
function exportCSV(){const rows=[['tipo','id','equipamento','status','prioridade','data'],...db.assets.map(x=>['equipamento',x.tag,x.name,x.status,x.criticality,'']),...db.reports.map(x=>['relato',x.id,x.asset,x.status,x.priority,x.date]),...db.orders.map(x=>['ordem',x.id,x.asset,x.status,x.priority,x.date]),...db.inspections.map(x=>['inspecao',x.id,x.asset,x.result,'',x.date])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\\n');const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='elite-qr-export.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='elite-qr-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function modal(title,body,saveFn){document.body.insertAdjacentHTML('beforeend','<div id="formModal" class="fixed inset-0 bg-black/80 z-[70] overflow-auto p-4"><div class="max-w-lg mx-auto bg-[#111827] border border-slate-700 rounded-2xl p-6 mt-8"><div class="flex justify-between"><h2 class="text-xl font-bold">'+title+'</h2><button onclick="document.getElementById(\'formModal\').remove()">✕</button></div>'+body+'<div class="flex gap-2 mt-6"><button onclick="'+saveFn+'" class="flex-1 bg-violet-600 rounded-xl py-3 font-bold">Salvar</button><button onclick="document.getElementById(\'formModal\').remove()" class="px-5 bg-slate-800 rounded-xl">Cancelar</button></div></div></div>')}
function input(id,label,val=''){return '<label class="block text-sm text-slate-400">'+label+'<input id="'+id+'" value="'+esc(val)+'" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"></label>'}
function newAsset(){modal('Novo equipamento','<div class="space-y-3 mt-5">'+input('a_tag','TAG')+input('a_name','Nome')+input('a_man','Fabricante')+input('a_model','Modelo')+input('a_serial','Número de série')+input('a_loc','Localização')+input('a_team','Equipe')+'<label class="block text-sm text-slate-400">Criticidade<select id="a_crit" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></label></div>','saveAsset()')}
function saveAsset(){const v=id=>document.getElementById(id).value.trim();if(!v('a_tag')||!v('a_name'))return toast('TAG e nome são obrigatórios.');if(db.assets.some(x=>x.tag===v('a_tag')))return toast('TAG já cadastrada.');db.assets.push({id:uid(),tag:v('a_tag'),name:v('a_name'),manufacturer:v('a_man'),model:v('a_model'),serial:v('a_serial'),location:v('a_loc')||'Não informado',team:v('a_team')||'Não informado',criticality:document.getElementById('a_crit').value,status:'Operacional',qr:v('a_tag')});save();document.getElementById('formModal').remove();render();toast('Equipamento cadastrado.')}
function editAsset(id){const x=db.assets.find(a=>a.id===id);if(!x)return;modal('Editar equipamento','<div class="space-y-3 mt-5">'+input('a_tag','TAG',x.tag)+input('a_name','Nome',x.name)+input('a_man','Fabricante',x.manufacturer)+input('a_model','Modelo',x.model)+input('a_serial','Número de série',x.serial)+input('a_loc','Localização',x.location)+input('a_team','Equipe',x.team)+'<label class="block text-sm text-slate-400">Criticidade<select id="a_crit" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"><option '+(x.criticality==='Baixa'?'selected':'')+'>Baixa</option><option '+(x.criticality==='Média'?'selected':'')+'>Média</option><option '+(x.criticality==='Alta'?'selected':'')+'>Alta</option></select></label><label class="block text-sm text-slate-400">Status<select id="a_status" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"><option '+(x.status==='Operacional'?'selected':'')+'>Operacional</option><option '+(x.status==='Atenção'?'selected':'')+'>Atenção</option><option '+(x.status==='Parado'?'selected':'')+'>Parado</option></select></label></div>','updateAsset(\''+id+'\')')}
function updateAsset(id){const x=db.assets.find(a=>a.id===id),v=k=>document.getElementById(k).value.trim();if(!x)return;if(!v('a_tag')||!v('a_name'))return toast('TAG e nome são obrigatórios.');if(db.assets.some(a=>a.tag===v('a_tag')&&a.id!==id))return toast('TAG já cadastrada.');Object.assign(x,{tag:v('a_tag'),name:v('a_name'),manufacturer:v('a_man'),model:v('a_model'),serial:v('a_serial'),location:v('a_loc'),team:v('a_team'),criticality:document.getElementById('a_crit').value,status:document.getElementById('a_status').value,qr:x.qr||v('a_tag')});save();document.getElementById('formModal').remove();selected=x;render();toast('Equipamento atualizado.')}
function deleteAsset(id){const x=db.assets.find(a=>a.id===id);if(!x)return;document.getElementById('deleteModal')?.remove();document.body.insertAdjacentHTML('beforeend','<div id="deleteModal" class="fixed inset-0 bg-black/80 z-[90] flex items-center justify-center p-4"><div class="max-w-md w-full bg-[#111827] border border-slate-700 rounded-2xl p-6"><div class="text-rose-300 font-black text-lg">Confirmar exclusão</div><p class="text-slate-300 mt-3">Excluir <b>'+esc(x.tag)+'</b> — '+esc(x.name)+'?</p><p class="text-xs text-slate-500 mt-2">Relatos e OS locais permanecerão no histórico.</p><div class="flex gap-2 mt-6"><button onclick="confirmDeleteAsset(\''+id+'\')" class="flex-1 bg-rose-600 rounded-xl py-3 font-bold">Excluir</button><button onclick="document.getElementById(\'deleteModal\').remove()" class="flex-1 bg-slate-800 rounded-xl py-3">Cancelar</button></div></div></div>')}
function confirmDeleteAsset(id){const x=db.assets.find(a=>a.id===id);if(!x)return;db.assets=db.assets.filter(a=>a.id!==id);save();document.getElementById('deleteModal')?.remove();nav('assets');toast('Equipamento excluído.')}
function setReportStatus(id,status){const x=db.reports.find(r=>r.id===id);if(!x)return;x.status=status;save();render();toast('Status do relato atualizado.')}
function setOrderStatus(id,status){const x=db.orders.find(o=>o.id===id);if(!x)return;x.status=status;save();render();toast('Status da OS atualizado.')}
function newReport(asset=''){modal('Novo relato','<div class="space-y-3 mt-5">'+input('r_title','Título')+input('r_asset','TAG do equipamento',asset)+'<textarea id="r_desc" placeholder="Descreva o problema..." class="w-full h-28 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"></textarea><label class="block text-sm text-slate-400">Prioridade<select id="r_pri" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></label></div>','saveReport()')}
function saveReport(){const t=document.getElementById('r_title').value.trim(),a=document.getElementById('r_asset').value.trim();if(!t||!a)return toast('Título e equipamento são obrigatórios.');db.reports.unshift({id:uid(),asset:a,title:t,description:document.getElementById('r_desc').value,priority:document.getElementById('r_pri').value,status:'Aberto',date:today()});save();document.getElementById('formModal').remove();render();toast('Relato registrado.')}
function nextOS(){let n=1;db.orders.forEach(o=>{const m=String(o.id).match(/OS-(\d+)/);if(m)n=Math.max(n,Number(m[1])+1)});return 'OS-'+String(n).padStart(6,'0')}
function newOrder(asset=''){modal('Nova ordem de serviço','<div class="space-y-3 mt-5">'+input('o_asset','TAG do equipamento',asset)+'<label class="block text-sm text-slate-400">Tipo<select id="o_type" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"><option>Corretiva</option><option>Preventiva</option><option>Inspeção</option></select></label><label class="block text-sm text-slate-400">Prioridade<select id="o_pri" class="mt-1 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"><option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option></select></label>'+input('o_team','Equipe')+'<textarea id="o_desc" placeholder="Descrição do serviço" class="w-full h-28 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3"></textarea></div>','saveOrder()')}
function saveOrder(){const a=document.getElementById('o_asset').value.trim();if(!a)return toast('Informe o equipamento.');db.orders.unshift({id:nextOS(),asset:a,type:document.getElementById('o_type').value,priority:document.getElementById('o_pri').value,status:'Aberta',team:document.getElementById('o_team').value||'Não atribuída',date:today(),desc:document.getElementById('o_desc').value});save();document.getElementById('formModal').remove();render();toast('OS criada.')}
function newInspection(asset=''){modal('Nova inspeção','<div class="space-y-4 mt-5">'+input('i_asset','TAG do equipamento',asset)+['Ruído anormal ausente?','Sem vazamentos visíveis?','Temperatura normal?','Proteções instaladas?','Limpeza adequada?'].map((q,i)=>'<div class="bg-slate-900 rounded-xl p-3"><div class="text-sm font-semibold">'+q+'</div><select id="i_'+i+'" class="mt-2 w-full bg-slate-800 rounded-lg px-3 py-2"><option>OK</option><option>Atenção</option><option>Falha</option><option>N/A</option></select></div>').join('')+'</div>','saveInspection()')}
function saveInspection(){const a=document.getElementById('i_asset').value.trim();if(!a)return toast('Informe o equipamento.');const fail=[0,1,2,3,4].some(i=>document.getElementById('i_'+i).value==='Falha');db.inspections.unshift({id:uid(),asset:a,result:fail?'Falha':'OK',date:new Date().toLocaleString('pt-BR')});if(fail)db.reports.unshift({id:uid(),asset:a,title:'Falha encontrada na inspeção',description:'Relato gerado automaticamente pelo checklist.',priority:'Alta',status:'Aberto',date:today()});save();document.getElementById('formModal').remove();render();toast(fail?'Inspeção concluída: falha gerou relato.':'Inspeção concluída.')}
function render(){const q=new URLSearchParams(location.search).get('qr');if(q){const x=db.assets.find(a=>a.qr===q||a.tag===q);if(x){selected=x;page='asset'}}let c=page==='dashboard'?dashboard():page==='assets'?assets():page==='asset'?assetDetail():page==='scan'?scan():page==='reports'?reports():page==='orders'?orders():page==='manager'?manager():inspections();document.getElementById('app').innerHTML=c;if(page==='scan')startScanner()}
save();render();
</script></body></html>
